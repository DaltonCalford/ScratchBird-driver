[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchbird-superset"
version = "0.1.0"
description = "ScratchBird Superset driver (SQLAlchemy dialect + EngineSpec)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
keywords = ["scratchbird", "superset", "sqlalchemy", "sbwp"]
authors = [
  {name = "ScratchBird Project"},
]
dependencies = [
  "scratchbird>=0.1.0",
  "SQLAlchemy>=1.4,<3.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
superset = ["apache-superset>=4.0.0"]

tooling = ["pytest", "ruff"]

[project.entry-points."sqlalchemy.dialects"]
scratchbird = "scratchbird_superset.dialect:ScratchBirdDialect"

[project.entry-points."superset.db_engine_specs"]
scratchbird = "scratchbird_superset.engine_spec:ScratchBirdEngineSpec"

[tool.setuptools]
packages = ["scratchbird_superset"]
