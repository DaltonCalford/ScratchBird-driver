apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scratchbird-sidecar.fullname" . }}-sidecar-config
  labels:
    {{- include "scratchbird-sidecar.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes  1;
    error_log  /var/log/nginx/error.log warn;
    pid        /tmp/nginx.pid;

    events {
      worker_connections  1024;
    }

    stream {
      upstream scratchbird_backend {
        server {{ include "scratchbird-sidecar.fullname" . }}:{{ .Values.scratchbird.port }};
      }

      server {
        listen {{ .Values.sidecar.proxyPort }} {{ .Values.scratchbird.protocol | lower }};
        proxy_pass scratchbird_backend;
        proxy_timeout 1h;
        proxy_connect_timeout 1s;
      }
    }
