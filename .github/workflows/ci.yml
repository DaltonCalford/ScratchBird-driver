name: Driver CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  driver-matrix:
    name: ${{ matrix.language }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            language: go
          - os: windows-latest
            language: go
          - os: ubuntu-latest
            language: node
          - os: windows-latest
            language: node
          - os: ubuntu-latest
            language: python
          - os: windows-latest
            language: python
          - os: ubuntu-latest
            language: ruby
          - os: windows-latest
            language: ruby
          - os: ubuntu-latest
            language: rust
          - os: windows-latest
            language: rust
          - os: ubuntu-latest
            language: php
          - os: windows-latest
            language: php
          - os: ubuntu-latest
            language: r
          - os: windows-latest
            language: r
          - os: ubuntu-latest
            language: dotnet
          - os: windows-latest
            language: dotnet
          - os: ubuntu-latest
            language: jdbc
          - os: windows-latest
            language: jdbc
          - os: ubuntu-latest
            language: pascal
          - os: windows-latest
            language: pascal
          - os: ubuntu-latest
            language: dart
          - os: windows-latest
            language: dart
          - os: ubuntu-latest
            language: cpp
          - os: windows-latest
            language: cpp
          - os: ubuntu-latest
            language: odbc
          - os: windows-latest
            language: odbc
          - os: ubuntu-latest
            language: cli
          - os: windows-latest
            language: cli
          - os: ubuntu-latest
            language: swift
          - os: ubuntu-latest
            language: elixir
          - os: windows-latest
            language: elixir
          - os: ubuntu-latest
            language: mojo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        if: matrix.language == 'node'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('tracks/alpha/drivers/node/package-lock.json', 'tracks/alpha/drivers/node/npm-shrinkwrap.json', 'tracks/alpha/drivers/node/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        if: matrix.language == 'python'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('tracks/alpha/drivers/python/pyproject.toml', 'tracks/alpha/drivers/python/setup.cfg', 'tracks/alpha/drivers/python/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Ruby
        if: matrix.language == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tracks/alpha/drivers/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tracks/alpha/drivers/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup PHP
        if: matrix.language == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Cache Composer
        if: matrix.language == 'php'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
            ~\AppData\Local\Composer\cache
          key: ${{ runner.os }}-composer-${{ hashFiles('tracks/alpha/drivers/php/composer.lock', 'tracks/alpha/drivers/php/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup R
        if: matrix.language == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Setup R dependencies
        if: matrix.language == 'r'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: tracks/beta/drivers/r

      - name: Setup .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        if: matrix.language == 'dotnet'
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.nuget/v3-cache
            ~\AppData\Local\NuGet\v3-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('tracks/alpha/drivers/dotnet/**/*.csproj', 'tracks/alpha/drivers/dotnet/**/*.sln', 'tracks/alpha/drivers/dotnet/**/packages.lock.json', 'tracks/alpha/drivers/dotnet/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Java
        if: matrix.language == 'jdbc'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Dart
        if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.3.0"

      - name: Setup Elixir/Erlang
        if: matrix.language == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          elixir-version: "1.15.7"

      - name: Install native build deps (Linux)
        if: runner.os == 'Linux' && (matrix.language == 'cpp' || matrix.language == 'odbc' || matrix.language == 'cli')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev unixodbc-dev

      - name: Install OpenSSL (Windows native builds)
        if: runner.os == 'Windows' && (matrix.language == 'cpp' || matrix.language == 'odbc' || matrix.language == 'cli')
        shell: powershell
        run: |
          choco install openssl.light --no-progress -y
          $dir = Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)' -Filter 'OpenSSL-Win*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dir) {
            throw "OpenSSL install path not found"
          }
          "OPENSSL_ROOT_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache Gradle
        if: matrix.language == 'jdbc'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tracks/alpha/drivers/jdbc/**/*.gradle*', 'tracks/alpha/drivers/jdbc/gradle.properties', 'tracks/alpha/drivers/jdbc/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install FreePascal (Linux)
        if: matrix.language == 'pascal' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler

      - name: Install FreePascal (Windows)
        if: matrix.language == 'pascal' && runner.os == 'Windows'
        shell: powershell
        run: |
          choco install freepascal --no-progress -y

      - name: Build/Test Dart
        if: matrix.language == 'dart'
        run: |
          cd tracks/beta/drivers/dart
          dart pub get
          dart test

      - name: Setup Mojo (Linux, gated)
        if: matrix.language == 'mojo' && runner.os == 'Linux'
        env:
          MOJO_ENABLED: ${{ vars.MOJO_ENABLED }}
        run: |
          if [ "${MOJO_ENABLED}" != "true" ]; then
            echo "Skipping Mojo: set MOJO_ENABLED=true to install the toolchain."
            exit 0
          fi
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          mkdir -p /tmp/mojo-env
          cd /tmp/mojo-env
          pixi init . -c https://conda.modular.com/max-nightly/ -c conda-forge
          pixi add mojo
          pixi run mojo --version

      - name: Go tests
        if: matrix.language == 'go'
        working-directory: tracks/alpha/drivers/go
        run: go test ./...

      - name: Node tests
        if: matrix.language == 'node'
        working-directory: tracks/alpha/drivers/node
        run: |
          npm install
          npm test

      - name: Python tests
        if: matrix.language == 'python'
        working-directory: tracks/alpha/drivers/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest

      - name: Build/Test Mojo (gated)
        if: matrix.language == 'mojo'
        env:
          MOJO_ENABLED: ${{ vars.MOJO_ENABLED }}
        run: |
          if [ "${MOJO_ENABLED}" != "true" ]; then
            echo "Skipping Mojo: set MOJO_ENABLED=true to run Mojo tests."
            exit 0
          fi
          if [ ! -d /tmp/mojo-env ]; then
            echo "Mojo env missing; ensure setup step completed."
            exit 1
          fi
          export MOJO_PIXI_MANIFEST=/tmp/mojo-env
          cd "$GITHUB_WORKSPACE/tracks/alpha/drivers/mojo"
          pixi run -m /tmp/mojo-env --executable mojo run -I src -I src/scratchbird tests/scratchbird_surface.mojo
          pixi run -m /tmp/mojo-env --executable mojo run -I src -I src/scratchbird tests/native_bootstrap.mojo
          pixi run -m /tmp/mojo-env --executable mojo run tests/metadata_execution.mojo
          pixi run -m /tmp/mojo-env --executable mojo run tests/metadata_recursive_schema.mojo
          python3 tests/integration.py
          tests/sbdriver-conformance --manifest ../../../../docs/fixtures/sbwp_conformance_manifest.json

      - name: Ruby tests
        if: matrix.language == 'ruby'
        working-directory: tracks/alpha/drivers/ruby
        run: ruby -Ilib:test test/*.rb

      - name: Rust tests
        if: matrix.language == 'rust'
        working-directory: tracks/alpha/drivers/rust
        run: cargo test

      - name: PHP tests
        if: matrix.language == 'php'
        working-directory: tracks/alpha/drivers/php
        run: |
          composer install
          vendor/bin/phpunit tests

      - name: R checks
        if: matrix.language == 'r'
        working-directory: tracks/beta/drivers/r
        run: |
          R CMD build .
          Rscript -e "pkgs <- Sys.glob('scratchbird_*.tar.gz'); if (length(pkgs) == 0) stop('No package tarball found after R CMD build') ; system2('R', c('CMD','check', pkgs[1], '--no-manual'), stdout = TRUE, stderr = TRUE)"

      - name: .NET tests
        if: matrix.language == 'dotnet'
        working-directory: tracks/alpha/drivers/dotnet
        run: dotnet test

      - name: JDBC tests (Linux)
        if: matrix.language == 'jdbc' && runner.os == 'Linux'
        working-directory: tracks/alpha/drivers/jdbc
        run: ./gradlew test

      - name: JDBC tests (Windows)
        if: matrix.language == 'jdbc' && runner.os == 'Windows'
        working-directory: tracks/alpha/drivers/jdbc
        shell: cmd
        run: gradlew.bat test

      - name: Elixir tests
        if: matrix.language == 'elixir'
        working-directory: tracks/p3/drivers/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix test

      - name: Swift tests (Linux)
        if: matrix.language == 'swift' && runner.os == 'Linux'
        working-directory: tracks/beta/drivers/swift
        run: swift test

      - name: C++ build/tests
        if: matrix.language == 'cpp'
        run: |
          cmake -S tracks/beta/drivers/cpp -B build-cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cpp --config Release
          ctest --test-dir build-cpp --output-on-failure --build-config Release

      - name: ODBC build
        if: matrix.language == 'odbc'
        run: |
          cmake -S tracks/alpha/drivers/odbc -B build-odbc -DCMAKE_BUILD_TYPE=Release
          cmake --build build-odbc --config Release

      - name: ODBC enterprise readiness gate (in-tree)
        if: matrix.language == 'odbc' && runner.os == 'Linux'
        run: ODBC_009_BI_SMOKE_MANDATORY=1 ./artifacts/enterprise-readiness/ODBC-009/run_odbc_enterprise_gate.sh

      - name: Upload ODBC enterprise gate log
        if: matrix.language == 'odbc' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: odbc-enterprise-gate-${{ github.run_id }}-${{ matrix.language }}-${{ matrix.os }}
          path: artifacts/enterprise-readiness/ODBC-009/latest_verification.log
          if-no-files-found: ignore
          retention-days: 30

      - name: CLI build (Linux)
        if: matrix.language == 'cli' && runner.os == 'Linux'
        run: |
          cmake -S . -B build_cli -DSB_BUILD_CLI=ON -DSB_BUILD_CPP=ON -DSB_BUILD_ODBC=OFF
          cmake --build build_cli --config Release

      - name: CLI build (Windows)
        if: matrix.language == 'cli' && runner.os == 'Windows'
        shell: powershell
        run: |
          cmake -S . -B build_cli -DSB_BUILD_CLI=ON -DSB_BUILD_CPP=ON -DSB_BUILD_ODBC=OFF
          cmake --build build_cli --config Release

      - name: Pascal build (Linux)
        if: matrix.language == 'pascal' && runner.os == 'Linux'
        run: |
          fpc -Fu./tracks/alpha/drivers/pascal/src tracks/alpha/drivers/pascal/tests/ConfigTests.pas
          fpc -Fu./tracks/alpha/drivers/pascal/src tracks/alpha/drivers/pascal/tests/SqlTests.pas
          fpc -Fu./tracks/alpha/drivers/pascal/src tracks/alpha/drivers/pascal/tests/IntegrationTest.pas

      - name: Pascal build (Windows)
        if: matrix.language == 'pascal' && runner.os == 'Windows'
        shell: cmd
        run: |
          fpc -Fu.\tracks\alpha\drivers\pascal\src tracks\alpha\drivers\pascal\tests\ConfigTests.pas
          fpc -Fu.\tracks\alpha\drivers\pascal\src tracks\alpha\drivers\pascal\tests\SqlTests.pas
          fpc -Fu.\tracks\alpha\drivers\pascal\src tracks\alpha\drivers\pascal\tests\IntegrationTest.pas

  jdbc203-cross-runtime-gate:
    name: JDBC/.NET cross-runtime gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-gradle-${{ hashFiles('tracks/alpha/drivers/jdbc/**/*.gradle*', 'tracks/alpha/drivers/jdbc/gradle.properties', 'tracks/alpha/drivers/jdbc/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ubuntu-gradle-

      - name: Run JDBC-203 cross-runtime contract
        env:
          JDBC203_STRICT_GATE: ${{ vars.JDBC203_STRICT_GATE || 'false' }}
          SCRATCHBIRD_DOTNET_URL: ${{ secrets.SCRATCHBIRD_DOTNET_URL }}
          SCRATCHBIRD_DOTNET_CANCEL_SQL: ${{ secrets.SCRATCHBIRD_DOTNET_CANCEL_SQL }}
          SCRATCHBIRD_JDBC_URL: ${{ secrets.SCRATCHBIRD_JDBC_URL }}
          SCRATCHBIRD_JDBC_CANCEL_SQL: ${{ secrets.SCRATCHBIRD_JDBC_CANCEL_SQL }}
        run: bash artifacts/enterprise-readiness/JDBC-203/run_cross_runtime_pool_contract.sh

      - name: Upload JDBC-203 contract artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jdbc203-cross-runtime-${{ github.run_id }}
          path: |
            artifacts/enterprise-readiness/JDBC-203/latest_verification.log
            artifacts/enterprise-readiness/JDBC-203/latest_contract_summary.json
          if-no-files-found: ignore
          retention-days: 30
